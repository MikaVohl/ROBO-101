[project]
name = "robo-101"
version = "0.1.0"
description = "MuJoCo robotics lab: a six-axis arm and differential-drive rover"
readme = "README.md"
authors = [
    { name = "Mika Vohl", email = "mikavohl@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "mujoco>=3.3,<4",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
robo = "robo_101.cli:main"
robo-101 = "robo_101.cli:main"
robo-web = "robo_101.server:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# These learning snippets use neighbors/reconstruct injected by the browser runner.
"web/public/planning/solutions/*.py" = ["F821"]

[tool.uv.build-backend]
# Include editable frontend sources in the sdist; generated assets are already in the module.
source-include = [
    "web/src/**", "web/public/planning/**", "web/public/favicon.*",
    "web/index.html", "web/scripts/**", "web/tests/**", "tests/**", "examples/**",
    "package.json", "package-lock.json", "tsconfig.json", "vite.config.ts",
    "playwright.config.ts", ".prettierrc.json", "uv.lock", ".python-version",
]
